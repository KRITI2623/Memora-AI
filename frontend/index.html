<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memora AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand-row">
                <div class="brand">
                    <span class="brand-mark">M</span>
                    <span>Memora AI</span>
                </div>
                <button id="newFolderButton" class="primary-btn small-btn">+ New Folder</button>
            </div>
            <ul id="folderList" class="folder-list" aria-label="Folder list"></ul>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <button class="menu-button" id="menuButton" aria-label="Toggle sidebar">☰</button>
                <label class="search-wrap" aria-label="Search resources">
                    <span class="search-icon">⌕</span>
                    <input id="searchInput" type="text" placeholder="Search your resources...">
                </label>
            </header>

            <section class="dashboard">
                <div class="welcome-section">
                    <h1>Welcome to Memora AI 👋</h1>
                    <p>Your personal digital memory vault</p>
                </div>
                <div id="statsGrid" class="stats-grid"></div>
            </section>

            <section class="workspace">
                <div id="selectedFolder" class="selected-folder"></div>
            </section>
        </main>
    </div>

    <input type="file" id="pdfInput" accept=".pdf" hidden>
    <input type="file" id="videoInput" accept="video/*" hidden>
    <input type="file" id="imageInput" accept="image/*" hidden>

    <script src="script.js"></script>
</body>

</html>
